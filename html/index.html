<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <title>Quantity Measurement</title>
    <link rel="stylesheet" href="../css/style.css" />
</head>

<body>
    <div class="container-fluid p-0">
        <div class="header text-center text-white py-3">
            <h2>Welcome To Quantity Measurement</h2>
        </div>

        <div class="container mt-4">
            <div id="error-banner" class="alert alert-danger d-none" role="alert"></div>

            <p class="section-title">CHOOSE TYPE</p>

            <div class="row" id="type-selector">
                <div class="col-md-3">
                    <div class="type-card active text-center" data-type="Length">
                        <div class="icon">
                            <i class="fa-solid fa-ruler"></i>
                        </div>
                        <p class="mb-0">Length</p>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="type-card text-center" data-type="Weight">
                        <div class="icon">
                            <i class="fa-solid fa-weight-scale"></i>
                        </div>
                        <p class="mb-0">Weight</p>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="type-card text-center" data-type="Temperature">
                        <div class="icon">
                            <i class="fa-solid fa-thermometer"></i>
                        </div>
                        <p class="mb-0">Temperature</p>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="type-card text-center" data-type="Volume">
                        <div class="icon">
                            <i class="fa-solid fa-flask"></i>
                        </div>
                        <p class="mb-0">Volume</p>
                    </div>
                </div>
            </div>

            <p class="section-title mt-4">CHOOSE ACTION</p>

            <div class="row g-3" id="action-buttons">
                <div class="col-md-4">
                    <button class="btn action-btn active w-100" data-action="Conversion">
                        Conversion
                    </button>
                </div>

                <div class="col-md-4">
                    <button class="btn action-btn w-100" data-action="Comparison">
                        Comparison
                    </button>
                </div>

                <div class="col-md-4">
                    <button class="btn action-btn w-100" data-action="Arithmetic">
                        Arithmetic
                    </button>
                </div>
            </div>

            <div id="operator-selector" class="row mt-3" style="display: none;">
                <div class="col-12">
                    <label class="form-label fw-bold" for="operator-select">OPERATOR</label>
                    <select id="operator-select" class="form-select">
                        <option value="+">+</option>
                        <option value="-">-</option>
                        <option value="*">*</option>
                        <option value="/">/</option>
                    </select>
                </div>
            </div>

            <div class="row mt-4 g-4">
                <div class="col-md-6">
                    <label class="form-label fw-bold" for="from-value">FROM</label>
                    <div class="input-box">
                        <input type="number" id="from-value" class="form-control value-input" value="1" />
                        <select id="from-unit" class="form-select">
                            <option value="">-- Select Unit --</option>
                        </select>
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold" for="to-value">TO</label>
                    <div class="input-box">
                        <input type="number" id="to-value" class="form-control value-input" value="" />
                        <select id="to-unit" class="form-select">
                            <option value="">-- Select Unit --</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-12">
                    <div class="input-box">
                        <h5 class="fw-bold mb-3">Result</h5>
                        <div id="result-display">
                            <span id="result-value">--</span>
                            <span id="result-unit"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mt-4 mb-5">
                <div class="col-12">
                    <div class="input-box">
                        <h5 class="fw-bold mb-3">History</h5>
                        <ul id="history-list" class="mb-0 ps-3">
                            <li class="text-muted">No history yet.</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../javascript/conversion.js"></script>
    <script src="../javascript/api.js"></script>
    <script src="../javascript/ui.js"></script>
    <script src="../javascript/app.js"></script>
</body>

</html>
